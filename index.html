<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERRA Retirement Planner | TERRA Academy</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="landing-shell">

    <section class="hero-card">

      <div class="brand-row">
        <div class="brand-logo-wrap">
          <img
            src="Terra-logo.png"
            alt="TERRA Academy Logo"
            class="brand-logo"
          >
        </div>

        <div class="brand-text">
          <div class="brand-name">TERRA</div>
          <div class="brand-subtitle">ACADEMY</div>
        </div>
      </div>

      <div class="hero-grid">

        <div class="hero-copy">

          <h1>
            TERRA<br>
            Retirement Planner
          </h1>

          <div class="gold-divider"></div>

          <h2>
            美好的退休生活，一切由完善的規劃開始
          </h2>

          <p class="intro">
            歡迎使用 TERRA Retirement Planner。
            這個工具會陪你一步一步建立退休規劃，
            了解你的退休目標、現有資源，
            以及未來需要準備的方向。
          </p>

          <div class="benefit-block">
            <h3>完成後，你會更清楚了解：</h3>

            <ul>
              <li>你希望建立怎樣的退休生活</li>
              <li>退休大約需要多少資金</li>
              <li>現有退休資源是否足夠</li>
              <li>退休資金是否存在缺口</li>
              <li>可以如何逐步改善退休準備</li>
            </ul>
          </div>

          <a href="planner.html" class="start-button">
            <span>開始退休規劃</span>
            <span class="arrow">→</span>
          </a>

          <div class="time-note">
            約 15 分鐘 · 9 個步驟
          </div>

        </div>

        <div class="mascot-area">

          <div class="decor decor-chart">↗</div>
          <div class="decor decor-coin">HK$</div>

          <img
            src="Tero.png"
            alt="TERO 小獅子"
            class="mascot-image"
          >

        </div>

      </div>

    </section>

  </main>

</body>
</html>
