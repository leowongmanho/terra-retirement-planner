<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TERRA Retirement Planning</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="terra-home">

  <main class="home-shell">

    <section class="home-card">

      <!-- LEFT SIDE -->
      <div class="home-content">

        <!-- TERRA LOGO -->
        <div class="home-logo-wrap">
          <img
            src="Terra-logo.png"
            alt="TERRA Logo"
            class="home-logo"
          >
        </div>

        <!-- MAIN TITLE -->
        <header class="home-header">

          <h1 class="home-title">
            <span class="home-title-terra">TERRA</span>
            <span class="home-title-planning">
              RETIREMENT PLANNING
            </span>
          </h1>

          <div class="home-gold-line"></div>

          <h2 class="home-tagline">
            美好的退休生活，一切由完善的規劃開始
          </h2>

        </header>

        <!-- INTRO -->
        <p class="home-intro">
          這個工具會陪你一步一步建立退休規劃，
          了解你的退休目標、現有資源，
          以及未來需要準備的方向。
        </p>

        <!-- BENEFITS -->
        <section class="home-benefits">

          <h3>
            完成後，你會更清楚了解：
          </h3>

          <ul>
            <li>你希望建立怎樣的退休生活</li>
            <li>退休大約需要多少資金</li>
            <li>現有退休資源是否足夠</li>
            <li>退休資金是否存在缺口</li>
            <li>可以如何逐步改善退休準備</li>
          </ul>

        </section>

        <!-- CTA -->
        <a
          href="planner.html"
          class="home-start-button"
        >
          <span>開始退休規劃</span>
          <span class="home-button-arrow">→</span>
        </a>

        <p class="home-time">
          約 15 分鐘 · 10 個步驟
        </p>

      </div>


      <!-- RIGHT SIDE -->
      <div class="home-mascot">

        <div class="mascot-glow"></div>

        <img
          src="Tero.png"
          alt="TERO"
          class="home-tero"
        >

        <!-- TERO INTRODUCTION -->
        <div
          class="home-tero-intro"
          style="
            position:relative;
            z-index:2;
            width:min(330px,88%);
            margin:14px auto 0;
            padding:16px 18px;
            border:1px solid #eadfcd;
            border-left:5px solid #d7a922;
            border-radius:16px;
            background:rgba(255,253,248,.96);
            box-shadow:0 10px 24px rgba(18,47,87,.10);
            text-align:left;
          "
        >

          <strong
            style="
              display:block;
              color:#122f57;
              font-size:17px;
              margin-bottom:7px;
            "
          >
            你好，我是 TERO
          </strong>

          <p
            style="
              margin:0;
              color:#687386;
              font-size:12px;
              line-height:1.7;
            "
          >
            我會陪你一步一步規劃退休生活，
            幫你看清目標、資源與缺口，
            一起找出更合適的退休安排。
          </p>

        </div>

        <div class="dot-pattern"></div>

      </div>

    </section>

  </main>

</body>

</html>
