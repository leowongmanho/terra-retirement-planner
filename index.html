<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TERRA Retirement Planner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-bar">
    <div class="logo">
      TERRA
    </div>
  </header>

  <main class="hero">

    <div class="hero-content">

      <p class="eyebrow">
        TERRA Academy
      </p>

      <h1>
        TERRA Retirement Planner
      </h1>

      <h2 class="slogan">
        美好的退休生活，一切由完善的規劃開始
      </h2>

      <p class="intro">
        歡迎使用 TERRA Retirement Planner。
        我會陪你一步一步完成退休規劃，
        全程大約需要 15 分鐘。
      </p>

      <div class="result-preview">
        <p>完成後，你會更清楚了解：</p>

        <ul>
          <li>退休大約需要多少資金</li>
          <li>現有資源是否足夠</li>
          <li>退休資金是否存在缺口</li>
          <li>可以如何逐步改善退休準備</li>
        </ul>
      </div>

      <button id="start-btn">
        開始退休規劃
      </button>

      <p class="progress-note">
        約 15 分鐘 · 9 個步驟
      </p>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
